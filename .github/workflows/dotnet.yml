name: Build and Test Backend Project

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore Dependencies
      run: dotnet restore ../../Backend/NoteBoard/NoteBoard.slnx
      
    - name: Build
      run: dotnet build ../../Backend/NoteBoard/NoteBoard.slnx --no-restore --configuration Release
      
    - name: Test
      run: dotnet test ../../Backend/NoteBoard/NoteBoard.slnx --no-build --configuration Release --verbosity normal
