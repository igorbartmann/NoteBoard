<section class="auth-shell">
  <div class="auth-card">
    <header class="auth-header">
      <h1>Note<span class="brand">Board</span></h1>
      <p class="subtitle">Create your account</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span class="field-label">Name</span>
        <input
          type="text"
          formControlName="name"
          placeholder="Name"
          autocomplete="name"
          maxlength="50"
        />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small class="field-error">Name is required (up to 50 characters).</small>
        }
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input
          type="email"
          formControlName="email"
          placeholder="user@example.com"
          autocomplete="email"
          maxlength="254"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">A valid email is required.</small>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="new-password"
          maxlength="20"
        />
        <small class="field-hint">
          Up to 20 characters, must include upper, lower, digit, and one of
          <code>.!&#64;#$&amp;*-</code>
        </small>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">
            Password does not meet the requirements.
          </small>
        }
      </label>

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="form-success">{{ successMessage }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <footer class="auth-footer">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </footer>
  </div>
</section>
