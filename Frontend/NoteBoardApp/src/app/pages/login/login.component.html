<section class="login-shell">
  <div class="login-card">
    <header class="login-header">
      <h1>Note<span class="brand">Board</span></h1>
      <p class="subtitle">Sign in to manage your notes</p>
    </header>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" formControlName="email" placeholder="user@example.com" autocomplete="email"/>
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <small class="field-error">A valid email is required.</small>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password"/>
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <small class="field-error">Password is required.</small>
        }
      </label>

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <footer class="login-footer">
      Don't have an account? <a routerLink="/register">Create one</a>
    </footer>
  </div>
</section>
